<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <!-- ============================================================
       Partner Badge Lockup Template (960x300)
       Replace every {{TOKEN}} with your brand values.
       NEVER commit real brand logo paths or hexes to a public repo.

       Structure (top-tier variant shown):
         plate (diagonal material gradient) -> recessed frame ->
         4 corner marks (accent) -> logo zone | divider | text zone
         eyebrow (wide tracking) -> main line -> accent rule
         (rule width = pixel-measured tier label width) -> tier label
       For mid/base tiers see the variant notes at the bottom.
       ============================================================ -->
  <title id="title">{{COMPANY}} {{TIER_LABEL}} Partner Badge - {{DARK_OR_LIGHT}}</title>
  <desc id="desc">{{TIER_LABEL}} tier partner badge lockup.</desc>
  <defs>
    <!-- Material gradient: make the luminance swing large enough to READ as material -->
    <linearGradient id="plateGrad" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="952" y2="292">
      <stop offset="0" stop-color="{{PLATE_GRADIENT_TOP}}"/>
      <stop offset=".42" stop-color="{{PLATE_GRADIENT_MID}}"/>
      <stop offset="1" stop-color="{{PLATE_GRADIENT_BOTTOM}}"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="944" height="284" rx="20" fill="url(#plateGrad)"/>

  <!-- Recessed frame: barely visible, carries structure only -->
  <rect x="24" y="24" width="912" height="252" rx="14" stroke="{{NEUTRAL_FRAME}}" stroke-opacity=".10" stroke-width="1"/>

  <!-- Corner marks: accent color, carry tier identity ("frame = structure, corners = identity") -->
  <path d="M40,60 V40 H60" stroke="{{ACCENT}}" stroke-width="2"/>
  <path d="M900,40 H920 V60" stroke="{{ACCENT}}" stroke-width="2"/>
  <path d="M40,240 V260 H60" stroke="{{ACCENT}}" stroke-width="2"/>
  <path d="M900,260 H920 V240" stroke="{{ACCENT}}" stroke-width="2"/>

  <!-- Logo zone: replace this placeholder with your official wordmark.
       Keep the official logo's own colors/gradients; on accent blocks use the flat white version. -->
  <g transform="translate(64 119)" fill="{{LOGO_FILL}}">
    <text font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="2">{{WORDMARK}}</text>
  </g>

  <line x1="300" y1="70" x2="300" y2="230" stroke="{{NEUTRAL_FRAME}}" stroke-opacity=".25"/>

  <!-- Text zone -->
  <text x="348" y="118" fill="{{TEXT_EYEBROW}}" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="5.5">{{EYEBROW_TEXT}}</text>
  <text x="348" y="184" fill="{{TEXT_MAIN}}" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="850">{{MAIN_TEXT}}</text>
  <!-- Rule width must be PIXEL-MEASURED to match the tier label (see methodology/03) -->
  <line x1="348" y1="218" x2="{{RULE_X2}}" y2="218" stroke="{{ACCENT}}" stroke-width="3"/>
  <text x="348" y="248" fill="{{TEXT_TIER}}" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="850" letter-spacing="3">{{TIER_LABEL}}</text>
</svg>

<!--
  TIER VARIANTS (shared skeleton, accent amount escalates):

  MID TIER (local emphasis):
    - no corner marks, single visible hairline {{NEUTRAL_FRAME}} @ .16
    - add full-width bottom accent gradient bar, clipped to plate corners:
        <clipPath id="pClip"><rect x="8" y="8" width="944" height="284" rx="20"/></clipPath>
        <linearGradient id="barGrad" ...>{{ACCENT}} -> {{ACCENT_2}}</linearGradient>
        <rect x="8" y="284" width="944" height="8" fill="url(#barGrad)" clip-path="url(#pClip)"/>
    - tier label in {{ACCENT_2}}; rule becomes gradient, same length as label

  BASE TIER (open identity):
    - left-third accent gradient block with flat-white logo on top:
        <linearGradient id="blkGrad" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="300" y2="292">
          {{ACCENT_2}} -> {{ACCENT}}</linearGradient>
        <rect x="8" y="8" width="292" height="284" fill="url(#blkGrad)" clip-path="url(#pClip)"/>
    - remove the divider line (the block edge replaces it)

  LIGHT VERSIONS: invert plate (near-white gradient), text to near-black,
    use the official dark logo variant. Corner marks/rules keep accent color.

  Gotchas:
    - gradients referenced from inside a transformed group use the element's
      LOCAL coordinate system when gradientUnits="userSpaceOnUse"
    - always clip bars/blocks to the plate's rounded rect
-->
